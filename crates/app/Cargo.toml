[package]
name = "pomodoro"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Pomodoro timer in the Ubuntu system tray"

[dependencies]
pomodoro-core = { version = "0.1.0", path = "../core" }
ksni = { version = "0.3", features = ["blocking"] }
notify-rust = "4"
libc = "0.2"
anyhow = "1.0.104"
ureq = "3.5.1"
sha2 = "0.11.1"

[dev-dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api", "tokio"] }
