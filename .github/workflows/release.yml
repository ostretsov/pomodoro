# Tests, builds the .deb and attaches it to a GitHub release.
# Release:  make version V=x.y.z && git commit -am "Release x.y.z" && git tag vx.y.z && git push --follow-tags
#           (or the /release skill: .claude/skills/release/SKILL.md)
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # manual run: builds and tests the .deb, keeps it as a workflow artifact only

permissions:
  contents: write

jobs:
  deb:
    # The binary is static (musl), so the runner's Ubuntu version doesn't matter
    # for users; docker-test checks 22.04, 24.04 and rolling.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/app/Cargo.toml | head -1)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME but crates/app/Cargo.toml says $version (make version V=...)"; exit 1; }

      - name: Build and test dependencies
        # dbus-daemon for the D-Bus test, musl-gcc for the static binary.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dbus musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2

      - run: make lint
      - run: make test
      - run: make deb
      - name: Install in clean Ubuntu containers and run --self-test
        run: scripts/docker-test.sh

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: target/pomodoro_*_amd64.deb

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" target/pomodoro_*_amd64.deb --title "Pomodoro ${GITHUB_REF_NAME#v}" --generate-notes
